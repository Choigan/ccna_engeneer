frr defaults traditional
hostname r2
log stdout
!
interface lo
 ip address 203.0.113.2/32
 ip router isis CORE
 isis passive
!
interface eth1
 ip address 192.0.2.2/30
 ip router isis CORE
!
interface eth2
 ip address 198.51.100.1/30
 ip router isis CORE
!
router isis CORE
 net 49.0001.0000.0000.0002.00
 is-type level-1-2
 metric-style wide
!
